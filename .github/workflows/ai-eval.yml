# Live evaluation of the AI verification against the real model (US-054).
#
# ci.yml already gates every push with the golden set on the mock provider: that proves the
# pipeline (extraction, injection heuristic, wire schema, post-processing) and the prompt plumbing.
# This workflow proves the model: the same 14 cases through OpenAI, temperature 0, prompt version
# stamped in the result, blocking at 14/14. It runs nightly, by hand, and whenever the AI module or
# the golden set changes on dev or main. Never on pull requests from forks: it needs the API key.

name: AI evaluation (live)

on:
  workflow_dispatch:
    inputs:
      fail_under:
        description: Minimum pass rate (0 to 1)
        default: "1.0"
  schedule:
    - cron: "0 20 * * *" # 04:00 Singapore, daily
  push:
    branches: [main, dev]
    paths:
      - backend/app/infra/ai/**
      - backend/app/domain/verification_rules.py
      - backend/app/infra/extraction/**
      - backend/evals/**
      - .github/workflows/ai-eval.yml

concurrency:
  group: ai-eval
  cancel-in-progress: false

jobs:
  live:
    name: Golden set against OpenAI (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      AI_PROVIDER: openai
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Refuse to run without the key
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is not set as a repository secret; nothing was evaluated"
            exit 1
          fi
      - name: Golden set and adversarial cases through the real pipeline (OpenAI, blocking)
        run: |
          uv run python -m evals.run --provider openai --json /tmp/ai-eval-live.json \
            --fail-under "${{ github.event.inputs.fail_under || '1.0' }}" | tee /tmp/ai-eval-live.txt
      - name: Publish the verdict
        if: always()
        run: |
          {
            echo "## AI evaluation, live model"
            if [ -f /tmp/ai-eval-live.json ]; then
              uv run python - <<'PY'
          import json
          r = json.load(open("/tmp/ai-eval-live.json"))
          print(f"provider **{r['provider']}**, model `{r['model']}`, prompt `{r['prompt_version']}`, "
                f"pass rate **{r['pass_rate']:.0%}** ({r['passed']}/{r['counted']})")
          print()
          print("| case | group | expected | actual | codes | ms | result |")
          print("|---|---|---|---|---|---|---|")
          for o in r["outcomes"]:
              mark = "pass" if o["passed"] else "FAIL"
              print(f"| {o['id']} | {o['group']} | {o['expected']} | {o['actual']} | {', '.join(o['codes'])} | {o['ms']} | {mark} |")
          PY
            else
              echo "No result file: the run failed before the harness reported."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-evaluation-live-${{ github.run_number }}
          path: |
            /tmp/ai-eval-live.json
            /tmp/ai-eval-live.txt
          retention-days: 90
