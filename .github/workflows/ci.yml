name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]

# Least privilege by default; the images job raises `packages` on its own.
permissions:
  contents: read

# `shell: bash` gives `-o pipefail`: a failing command behind `| tee` fails the step.
defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: permitflow
          POSTGRES_PASSWORD: permitflow
          POSTGRES_DB: permitflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U permitflow -d permitflow_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+psycopg://permitflow:permitflow@localhost:5432/permitflow_test
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Release guard unit test
        working-directory: .
        run: python3 -m unittest scripts/test_release_guard.py
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=app --cov-report=term --cov-report=xml --cov-fail-under=80
      - name: Coverage summary
        if: always()
        run: |
          echo '### Backend coverage' >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=total 2>/dev/null | sed 's/^/Total: /; s/$/ %/' >> "$GITHUB_STEP_SUMMARY" || true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          echo '### Frontend coverage (all source files counted)' >> "$GITHUB_STEP_SUMMARY"
          npx vitest run --coverage --coverage.reporter=text-summary 2>/dev/null | grep -E 'Statements|Branches|Functions|Lines' >> "$GITHUB_STEP_SUMMARY" || true
      - run: npm run build
      - name: Bundle size (250 KB gzipped, US-087)
        run: npm run size

  ai:
    name: AI gate
    # The AI checks are their own workflow (US-056): six stages, each named in the run summary.
    uses: ./.github/workflows/ai-gate.yml

  audit:
    # Blocking since US-058: a known vulnerability in a production dependency, or a bandit finding of
    # medium severity or above, fails the build. (Before US-058 pip-audit had been failing on the
    # project's own editable line and nobody noticed, because the step was allowed to fail.)
    name: Dependency and code audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: pip-audit (production dependencies, blocking)
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > /tmp/req.txt
          uvx pip-audit -r /tmp/req.txt --desc --strict 2>&1 | tee /tmp/pip-audit.txt
      - name: bandit (backend source, blocking at medium)
        working-directory: backend
        run: uvx bandit -r app -q -ll -ii 2>&1 | tee /tmp/bandit.txt
      - name: npm audit (production dependencies, blocking at high)
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          # A vulnerability fails the job. A registry outage (npm's audit endpoint answering 503 during
          # maintenance) is retried three times and then fails too: the job never passes on "could not check".
          for attempt in 1 2 3; do
            if npm audit --omit=dev --audit-level=high 2>&1 | tee /tmp/npm-audit.txt; then exit 0; fi
            if grep -q "audit endpoint returned an error" /tmp/npm-audit.txt; then
              echo "npm audit endpoint unavailable (attempt $attempt of 3), retrying in 60 s"; sleep 60
            else
              exit 1
            fi
          done
          echo "npm audit endpoint unavailable after three attempts; treating as a failed check"; exit 1
      - name: Summary
        if: always()
        run: |
          {
            echo "## Dependency and code audit"
            echo '```'
            tail -n 3 /tmp/pip-audit.txt 2>/dev/null
            tail -n 3 /tmp/bandit.txt 2>/dev/null
            tail -n 3 /tmp/npm-audit.txt 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  semgrep:
    # US-103: the OWASP Top Ten, Python and TypeScript rule packs over our own source. Blocking at ERROR
    # severity; WARNING and INFO findings are listed in the log and do not fail the build. Runs on every pull
    # request and every push (so on dev and main). Semgrep is pinned and run through uvx, so there is no
    # third-party action in the path. The rules are fetched from the public registry with metrics off.
    name: Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Semgrep (owasp-top-ten, python, typescript; blocking at ERROR)
        run: |
          uvx --from semgrep==1.172.0 semgrep scan \
            --config p/owasp-top-ten --config p/python --config p/typescript \
            --severity ERROR --error --metrics=off \
            backend/app backend/scripts frontend/src 2>&1 | tee /tmp/semgrep.txt
      - name: Summary
        if: always()
        run: |
          {
            echo "## Semgrep"
            echo '```'
            grep -E "Findings:|Rules run:|Targets scanned:" /tmp/semgrep.txt || tail -n 5 /tmp/semgrep.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: permitflow
          POSTGRES_PASSWORD: permitflow
          POSTGRES_DB: permitflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U permitflow -d permitflow"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://permitflow:permitflow@localhost:5432/permitflow
      JWT_SECRET: ci-only-secret-that-is-long-enough
      CORS_ORIGINS: http://localhost:3000
      AI_PROVIDER: mock
      UPLOAD_DIR: /tmp/permitflow-uploads
      # Eight specs sign in from one runner address; the per-client limits (US-058) would throttle them.
      # They are exercised by their own integration tests, not by the browser suite.
      RATE_LIMIT_PER_MINUTE: "0"
      LOGIN_ATTEMPTS_PER_MINUTE: "0"
      # The specs arrange a visit and record it in one run; the visit-day rule (F12) has its own integration tests.
      SITE_VISIT_DAY_GUARD: "false"
      # Every seeded application is four document checks from one shared operator; the suite outgrew the daily
      # limit of 60 (US-096), so later specs saw "unavailable". The limit has its own integration tests.
      AI_RUNS_PER_USER_PER_DAY: "0"
      E2E_API_URL: http://localhost:8000/api/v1
      VITE_API_URL: http://localhost:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend up (migrate, seed, serve on :8000)
        working-directory: backend
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          uv run python scripts/seed.py
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/api/v1/health && break; sleep 1; done
          curl -fsS http://localhost:8000/api/v1/health > /dev/null || { echo 'backend did not start'; tail -n 50 /tmp/backend.log; exit 1; }
      - name: Frontend up (build, preview on :3000)
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          nohup npx vite preview --port 3000 --strictPort > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/ > /dev/null && break; sleep 1; done
          curl -fsS http://localhost:3000/ > /dev/null || { echo 'frontend did not start'; tail -n 50 /tmp/frontend.log; exit 1; }
      - name: Playwright (journey + scenarios)
        working-directory: frontend
        run: npm run e2e
      - name: Server logs on failure
        if: failure()
        run: tail -n 200 /tmp/backend.log /tmp/frontend.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  images:
    name: Images
    runs-on: ubuntu-latest
    needs: [backend, frontend, ai, e2e, secrets, audit, semgrep]
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      OWNER: ${{ github.repository_owner }}
    steps:
      # Full history and tags: the release guard compares a release tag with its release candidate.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release guard (v* tags only)
        if: github.ref_type == 'tag'
        run: python3 scripts/release_guard.py "$GITHUB_REF_NAME"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          short=${GITHUB_SHA::7}
          # Pull requests have refs like 12/merge, which is not a valid tag: keep it a plain word.
          ref=$(echo "$GITHUB_REF_NAME" | tr '/' '-')
          backend="ghcr.io/$owner/permitflow-backend:sha-$short,ghcr.io/$owner/permitflow-backend:$ref"
          frontend="ghcr.io/$owner/permitflow-frontend:sha-$short,ghcr.io/$owner/permitflow-frontend:$ref"
          # A release image tag (v0.3.0) is written only by a run for that git tag, never by a branch push,
          # so `:v0.3.0` always means the commit the tag points at and cannot be overwritten by later
          # merges to main. The tag must equal the version in frontend/package.json (the app shows it).
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version=$(python3 -c 'import json; print(json.load(open("frontend/package.json"))["version"])')
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "tag $GITHUB_REF_NAME does not match frontend/package.json version $version" >&2
              exit 1
            fi
            backend="ghcr.io/$owner/permitflow-backend:sha-$short,ghcr.io/$owner/permitflow-backend:$GITHUB_REF_NAME"
            frontend="ghcr.io/$owner/permitflow-frontend:sha-$short,ghcr.io/$owner/permitflow-frontend:$GITHUB_REF_NAME"
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
      # US-103: each image is built once into the runner, scanned, and only then built again for the push (the
      # second build is a cache hit). Trivy blocks on a HIGH or CRITICAL vulnerability that has a fix; one with
      # no fix yet (`ignore-unfixed`) does not block, because nothing can be done about it today. An accepted
      # finding goes in `.trivyignore` with its reason and a review date, never as a bare id.
      - name: Backend image (build for the scan)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          push: false
          tags: permitflow-backend:scan
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Trivy, backend image (blocking at HIGH and CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: permitflow-backend:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.tags.outputs.backend }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      # The What's new page reads RELEASE_NOTES.md at build time (US-094); the image build's context is the
      # frontend folder alone, so the file is copied in first (ignored by git, see .gitignore).
      - name: Release notes into the frontend build context
        run: cp RELEASE_NOTES.md frontend/RELEASE_NOTES.md
      - name: Frontend image (build for the scan)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          push: false
          tags: permitflow-frontend:scan
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Trivy, frontend image (blocking at HIGH and CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: permitflow-frontend:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.tags.outputs.frontend }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Summary
        run: |
          {
            echo "## Images"
            echo '`'"${{ steps.tags.outputs.backend }}"'`'
            echo
            echo '`'"${{ steps.tags.outputs.frontend }}"'`'
            echo
            echo "Pushed: ${{ github.event_name == 'push' }} (pull requests only build)"
          } >> "$GITHUB_STEP_SUMMARY"
