name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: permitflow
          POSTGRES_PASSWORD: permitflow
          POSTGRES_DB: permitflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U permitflow -d permitflow_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+psycopg://permitflow:permitflow@localhost:5432/permitflow_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  ai:
    name: AI verification (config audit, golden set, adversarial)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      AI_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Configuration audit (provider wiring, pinned wire schema, prompt version, default model)
        run: |
          uv run python - <<'PY'
          from app.core.settings import Settings
          from app.infra.ai.factory import get_provider
          from app.infra.ai.openai_provider import PROMPT_VERSION, SYSTEM_PROMPT, WireResult
          from app.domain.verification_rules import VerificationResult
          s = Settings()
          assert s.openai_model == "gpt-4.1-mini", s.openai_model
          assert 0 < s.ai_confidence_threshold < 1
          assert PROMPT_VERSION and SYSTEM_PROMPT
          assert set(WireResult.model_json_schema()["properties"]["status"]["enum"]) == {"verified", "issues_found", "unreadable"}
          assert VerificationResult.model_config.get("extra") == "forbid"
          assert get_provider().name == "mock"
          print("configuration audit ok: model", s.openai_model, "prompt", PROMPT_VERSION)
          PY
      - name: Provider contract and rules (unit)
        run: uv run pytest tests/unit/test_verification_rules.py tests/unit/test_openai_wire.py tests/unit/test_mock_provider.py tests/unit/test_extraction.py -q
      - name: Golden set and adversarial cases through the real pipeline (mock provider, blocking)
        run: uv run python -m evals.run --provider mock --json /tmp/ai-eval.json --fail-under 1.0
      - name: Publish the verdict
        if: always()
        run: |
          {
            echo "## AI verification evaluation"
            uv run python - <<'PY'
          import json
          r = json.load(open("/tmp/ai-eval.json"))
          print(f"provider **{r['provider']}**, pass rate **{r['pass_rate']:.0%}** ({r['passed']}/{r['counted']} counted)")
          print()
          print("| case | group | expected | actual | result |")
          print("|---|---|---|---|---|")
          for o in r["outcomes"]:
              mark = "pass" if o["passed"] else ("known mock gap" if not o["counted"] else "FAIL")
              print(f"| {o['id']} | {o['group']} | {o['expected']} | {o['actual']} | {mark} |")
          PY
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-evaluation
          path: /tmp/ai-eval.json

  audit:
    name: Dependency audit (pip-audit, npm audit; reported, not blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: pip-audit
        working-directory: backend
        continue-on-error: true
        run: |
          uv sync --frozen
          uv export --frozen --no-dev --format requirements-txt > /tmp/req.txt
          uvx pip-audit -r /tmp/req.txt --desc 2>&1 | tee /tmp/pip-audit.txt
      - name: npm audit (production dependencies)
        working-directory: frontend
        continue-on-error: true
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev 2>&1 | tee /tmp/npm-audit.txt
      - name: Summary
        if: always()
        run: |
          {
            echo "## Dependency audit"
            echo '```'
            tail -n 5 /tmp/pip-audit.txt 2>/dev/null
            tail -n 5 /tmp/npm-audit.txt 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: E2E (Playwright against the running stack)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: permitflow
          POSTGRES_PASSWORD: permitflow
          POSTGRES_DB: permitflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U permitflow -d permitflow"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://permitflow:permitflow@localhost:5432/permitflow
      JWT_SECRET: ci-only-secret-that-is-long-enough
      CORS_ORIGINS: http://localhost:3000
      AI_PROVIDER: mock
      UPLOAD_DIR: /tmp/permitflow-uploads
      E2E_API_URL: http://localhost:8000/api/v1
      VITE_API_URL: http://localhost:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend up (migrate, seed, serve on :8000)
        working-directory: backend
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          uv run python scripts/seed.py
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/api/v1/health && break; sleep 1; done
      - name: Frontend up (build, preview on :3000)
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          nohup npx vite preview --port 3000 --strictPort > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/ > /dev/null && break; sleep 1; done
      - name: Playwright (journey + scenarios)
        working-directory: frontend
        run: npm run e2e
      - name: Server logs on failure
        if: failure()
        run: tail -n 200 /tmp/backend.log /tmp/frontend.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  docker:
    name: Docker build (backend image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: permitflow-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
