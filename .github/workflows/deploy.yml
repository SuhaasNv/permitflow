name: Deploy

# Continuous deployment (US-007). Runs after CI succeeded on dev or main, never on pull requests:
#   dev  -> Railway environment "development" (services track the :dev image tag), automatic
#   main -> Railway environment "production"  (services track the :main image tag): started by hand
#           (gh workflow run deploy.yml --ref main -f environment=production) and paused for a
#           required reviewer on the GitHub "production" environment before Railway is touched.
#           The automatic path is not used: a workflow_run job executes on the default branch (dev)
#           and the production environment admits main only, so that job is skipped here rather
#           than left to be rejected.
# "Run workflow" (workflow_dispatch) redeploys either environment from its current images by hand,
# for example after a platform incident. Railway pulls the images CI pushed to GHCR; nothing is
# built here. Rollback: redeploy an earlier sha- tag from the Railway dashboard.
#
# US-111, build once and promote: the images behind :main and sha-<merge> are the last release candidate's
# images, given their release names by the `promote` job in ci.yml (same digest, no rebuild). They still carry
# the candidate's version, so a production run takes the release version as an input and sets APP_VERSION on
# the backend and frontend services (the backend reads it at start, the frontend writes it into config.js);
# the post-deploy gate then requires /health and config.js to report that version.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev]
  workflow_dispatch:
    inputs:
      environment:
        description: Railway environment to redeploy from its current images
        type: choice
        required: true
        default: development
        options: [development, production]
      version:
        description: Production only. The release version being deployed, without the v (for example 0.5.0). Set as APP_VERSION on backend and frontend.
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.event.workflow_run.head_branch }}
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    # A required reviewer on the GitHub "production" environment holds the job here until approved.
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.event.workflow_run.head_branch == 'main' && 'production' || 'development') }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.event.workflow_run.head_branch == 'main' && 'production' || 'development') }}
      BACKEND_URL: ${{ vars.BACKEND_URL }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
    steps:
      - name: Pre-deploy gate (the run being deployed is the head of the branch)
        run: |
          test -n "$RAILWAY_TOKEN" || { echo "RAILWAY_TOKEN secret is missing"; exit 1; }
          test -n "$RAILWAY_PROJECT_ID" || { echo "RAILWAY_PROJECT_ID variable is missing"; exit 1; }
          test -n "$BACKEND_URL" -a -n "$FRONTEND_URL" || { echo "BACKEND_URL / FRONTEND_URL environment variables are missing"; exit 1; }
          if [ "$RAILWAY_ENV" = production ]; then
            echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "production needs the version input as X.Y.Z (got '$VERSION')"; exit 1; }
          fi
          echo "deploying ${{ github.event.workflow_run.head_sha || 'current images (manual run)' }} to $RAILWAY_ENV"
      # Pinned to the version the subcommands and flags below were checked against (deployment list --json,
      # redeploy --from-source --yes). Bump it in a pull request after running them with the new version.
      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.59.0
      - name: Label the promoted image with the release version (production)
        if: env.RAILWAY_ENV == 'production'
        run: |
          # No redeploy here: the redeploy below picks the variable up with the new image.
          for service in backend frontend; do
            railway variable set "APP_VERSION=$VERSION" --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENV" --service "$service" --skip-deploys
          done
      - name: Record the deployments that are live before the redeploy
        id: before
        run: |
          latest_id() {
            railway deployment list --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENV" --service "$1" --limit 1 --json \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d[0]["id"] if d else "")'
          }
          echo "backend=$(latest_id backend)" >> "$GITHUB_OUTPUT"
          echo "frontend=$(latest_id frontend)" >> "$GITHUB_OUTPUT"
          # The worker service exists in development only (production still verifies inline).
          if [ "$RAILWAY_ENV" = development ]; then echo "worker=$(latest_id worker)" >> "$GITHUB_OUTPUT"; fi
      - name: Redeploy backend, frontend and (development) worker from the new images
        run: |
          railway redeploy --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENV" --service backend --from-source --yes
          railway redeploy --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENV" --service frontend --from-source --yes
          if [ "$RAILWAY_ENV" = development ]; then
            railway redeploy --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENV" --service worker --from-source --yes
          fi
      - name: Wait for the NEW deployments to succeed (redeploy returns before the rollout)
        run: |
          # The health URLs keep answering from the old containers during the rollout, so the gate waits
          # for a deployment whose id differs from the one recorded before the redeploy to reach SUCCESS.
          # Accepting the first SUCCESS in the list would pass on the previous rollout.
          wait_for() {
            service="$1"; before="$2"
            for i in $(seq 1 60); do
              json=$(railway deployment list --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENV" --service "$service" --limit 1 --json)
              read -r id status < <(echo "$json" | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d[0]["id"] + " " + d[0]["status"]) if d else "NONE NONE")')
              if [ "$id" = "$before" ]; then
                echo "$service: new deployment not listed yet"
              else
                echo "$service: $id $status"
                case "$status" in
                  SUCCESS) return 0 ;;
                  FAILED|CRASHED|REMOVED) echo "$service deployment $id ended in $status"; return 1 ;;
                esac
              fi
              sleep 10
            done
            echo "$service: no new deployment reached SUCCESS in time"; return 1
          }
          wait_for backend "${{ steps.before.outputs.backend }}"
          wait_for frontend "${{ steps.before.outputs.frontend }}"
          if [ "$RAILWAY_ENV" = development ]; then wait_for worker "${{ steps.before.outputs.worker }}"; fi
      - name: Post-deploy gate (health of both tiers)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$BACKEND_URL/api/v1/health" > /dev/null && curl -fsS "$FRONTEND_URL/healthz" > /dev/null; then
              echo "both tiers healthy after $i checks"; exit 0
            fi
            sleep 10
          done
          echo "deployment did not become healthy"; exit 1
      - name: Post-deploy gate (frontend points at this environment's API)
        run: |
          curl -fsS "$FRONTEND_URL/config.js" | tee /tmp/config.js
          grep -q "$BACKEND_URL" /tmp/config.js
      - name: Full history and tags (production version gate)
        if: env.RAILWAY_ENV == 'production'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Post-deploy gate (production reports the release version and the candidate's commit)
        if: env.RAILWAY_ENV == 'production'
        run: |
          # The promoted image is the last candidate's image: /health must report the release version (APP_VERSION)
          # and the commit that candidate was built from (BUILD_COMMIT is the first 7 characters of GIT_SHA).
          rc=$(git tag --list "v$VERSION-rc.*" --sort=-version:refname | head -n 1)
          test -n "$rc" || { echo "no candidate tag v$VERSION-rc.N exists; $VERSION cannot be a promoted release"; exit 1; }
          want=$(git rev-list -n 1 "refs/tags/$rc" | cut -c1-7)
          field() { python3 -c 'import json,sys; print(json.load(sys.stdin)[sys.argv[1]])' "$1"; }
          for i in $(seq 1 12); do
            health=$(curl -fsS "$BACKEND_URL/api/v1/health") || health="{}"
            reported=$(echo "$health" | field version 2>/dev/null) || reported=""
            commit=$(echo "$health" | field commit 2>/dev/null) || commit=""
            config=$(curl -fsS "$FRONTEND_URL/config.js") || config=""
            if [ "$reported" = "$VERSION" ]; then
              if [ "$commit" = "$want" ]; then
                # A promoted image: its frontend must carry the version too.
                if echo "$config" | grep -q "appVersion: \"$VERSION\""; then
                  echo "backend and frontend report $VERSION, built from $want ($rc)"; exit 0
                fi
                echo "frontend config.js does not carry appVersion $VERSION yet (attempt $i of 12)"
              elif ! echo "$config" | grep -q "appVersion"; then
                # A rollback to an image from before US-111: it has no appVersion and reports its own build commit.
                echo "rollback to a pre-US-111 image: backend reports $VERSION (commit $commit); no frontend appVersion to check"; exit 0
              else
                echo "backend reports $VERSION but commit '$commit', not $want of $rc (attempt $i of 12)"
              fi
            else
              echo "backend reports '$reported', waiting for $VERSION (attempt $i of 12)"
            fi
            sleep 10
          done
          echo "production does not report $VERSION from $rc ($want): check APP_VERSION on both services and the image tag they are pinned to"; exit 1

  zap-baseline:
    # US-103. An OWASP ZAP baseline (passive) scan of the development site once the new deployment is healthy.
    # Report only: the step cannot fail the workflow (`continue-on-error`, `fail_action: false`) and no GitHub
    # issue is opened. The HTML, Markdown and JSON reports are uploaded as the `zap-baseline-report` artifact
    # (kept 90 days by default); read it on the run page. It scans development only, never production. It runs
    # for the automatic deploy after CI on `dev` and for a manual redeploy of development.
    name: ZAP baseline (development, report only)
    needs: deploy
    if: needs.deploy.result == 'success' && (github.event_name == 'workflow_run' || inputs.environment == 'development')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: ZAP baseline scan of https://dev.permitflow.space
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        continue-on-error: true
        with:
          target: https://dev.permitflow.space
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-baseline-report
