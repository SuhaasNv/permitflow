name: Deploy

# Continuous deployment (US-007). Runs after CI succeeded on dev or main, never on pull requests:
#   dev  -> Railway environment "development" (services track the :dev image tag), automatic
#   main -> Railway environment "production"  (services track the :main image tag): started by hand
#           (gh workflow run deploy.yml --ref main -f environment=production) and paused for a
#           required reviewer on the GitHub "production" environment before Railway is touched.
#           The automatic path is not used: a workflow_run job executes on the default branch (dev)
#           and the production environment admits main only, so that job is skipped here rather
#           than left to be rejected.
# "Run workflow" (workflow_dispatch) redeploys either environment from its current images by hand,
# for example after a platform incident. Railway pulls the images CI pushed to GHCR; nothing is
# built here. Rollback: redeploy an earlier sha- tag from the Railway dashboard.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev]
  workflow_dispatch:
    inputs:
      environment:
        description: Railway environment to redeploy from its current images
        type: choice
        required: true
        default: development
        options: [development, production]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.event.workflow_run.head_branch }}
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    # A required reviewer on the GitHub "production" environment holds the job here until approved.
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.event.workflow_run.head_branch == 'main' && 'production' || 'development') }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.event.workflow_run.head_branch == 'main' && 'production' || 'development') }}
      BACKEND_URL: ${{ vars.BACKEND_URL }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
    steps:
      - name: Pre-deploy gate (the run being deployed is the head of the branch)
        run: |
          test -n "$RAILWAY_TOKEN" || { echo "RAILWAY_TOKEN secret is missing"; exit 1; }
          test -n "$RAILWAY_PROJECT_ID" || { echo "RAILWAY_PROJECT_ID variable is missing"; exit 1; }
          test -n "$BACKEND_URL" -a -n "$FRONTEND_URL" || { echo "BACKEND_URL / FRONTEND_URL environment variables are missing"; exit 1; }
          echo "deploying ${{ github.event.workflow_run.head_sha || 'current images (manual run)' }} to $RAILWAY_ENV"
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Record the deployments that are live before the redeploy
        id: before
        run: |
          latest_id() {
            railway deployment list --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENV" --service "$1" --limit 1 --json \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d[0]["id"] if d else "")'
          }
          echo "backend=$(latest_id backend)" >> "$GITHUB_OUTPUT"
          echo "frontend=$(latest_id frontend)" >> "$GITHUB_OUTPUT"
      - name: Redeploy backend and frontend from the new images
        run: |
          railway redeploy --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENV" --service backend --from-source --yes
          railway redeploy --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENV" --service frontend --from-source --yes
      - name: Wait for the NEW deployments to succeed (redeploy returns before the rollout)
        run: |
          # The health URLs keep answering from the old containers during the rollout, so the gate waits
          # for a deployment whose id differs from the one recorded before the redeploy to reach SUCCESS.
          # Accepting the first SUCCESS in the list would pass on the previous rollout.
          wait_for() {
            service="$1"; before="$2"
            for i in $(seq 1 60); do
              json=$(railway deployment list --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENV" --service "$service" --limit 1 --json)
              read -r id status < <(echo "$json" | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d[0]["id"] + " " + d[0]["status"]) if d else "NONE NONE")')
              if [ "$id" = "$before" ]; then
                echo "$service: new deployment not listed yet"
              else
                echo "$service: $id $status"
                case "$status" in
                  SUCCESS) return 0 ;;
                  FAILED|CRASHED|REMOVED) echo "$service deployment $id ended in $status"; return 1 ;;
                esac
              fi
              sleep 10
            done
            echo "$service: no new deployment reached SUCCESS in time"; return 1
          }
          wait_for backend "${{ steps.before.outputs.backend }}"
          wait_for frontend "${{ steps.before.outputs.frontend }}"
      - name: Post-deploy gate (health of both tiers)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$BACKEND_URL/api/v1/health" > /dev/null && curl -fsS "$FRONTEND_URL/healthz" > /dev/null; then
              echo "both tiers healthy after $i checks"; exit 0
            fi
            sleep 10
          done
          echo "deployment did not become healthy"; exit 1
      - name: Post-deploy gate (frontend points at this environment's API)
        run: |
          curl -fsS "$FRONTEND_URL/config.js" | tee /tmp/config.js
          grep -q "$BACKEND_URL" /tmp/config.js
