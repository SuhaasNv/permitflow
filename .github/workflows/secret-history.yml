name: Secret history scan

# US-103. `ci.yml` already runs gitleaks on every push and pull request. This workflow adds the other half:
# the whole history of every branch and tag, once a week and on demand, so a secret that was committed and
# "removed" in a later commit, or that entered on a branch nobody scans, is still found.
#
# The gitleaks release is downloaded by version and verified against a SHA-256 written here, then run with
# `--log-opts="--all"` (every ref, every commit). The same command runs on a laptop:
#   gitleaks detect --source . --log-opts="--all" --redact
# It reads `.gitleaksignore` (reviewed false positives only, each with a reason) and fails on any other finding.
# How the scan was proven to catch a planted secret: docs/06-security/SECURITY_REVIEW.md, "Secret history scan".

on:
  workflow_dispatch:
  schedule:
    # Sunday 19:17 UTC, Monday 03:17 in Singapore.
    - cron: '17 19 * * 0'

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  history:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan the whole history (fails on any finding)
        run: |
          echo "commits reachable from any ref: $(git rev-list --all --count)"
          /tmp/gitleaks detect --source . --log-opts="--all" --redact --verbose \
            --report-format sarif --report-path /tmp/gitleaks-history.sarif --exit-code 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: gitleaks-history-report
          path: /tmp/gitleaks-history.sarif
          retention-days: 7
      - name: Summary
        if: always()
        run: |
          {
            echo "## Secret history scan"
            echo "Commits scanned: $(git rev-list --all --count) (every branch and tag). Result: ${{ job.status }}."
          } >> "$GITHUB_STEP_SUMMARY"
