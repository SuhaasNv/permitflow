        refId: C
        type: threshold
        expression: Zr
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - Zr
          reducer:
            type: last
            params: []
          type: query
    for: 0s
    labels:
      severity: info
      kind: digest
      environment: development
    annotations:
      summary: PermitFlow, the last hour, development
      api: '{{ if ge (index $values "Ar").Value 1.0 }}up{{ else }}DOWN{{ end }}'
      requests_per_minute: '{{ printf "%.0f" (index $values "Dr").Value }}'
      p995_ms: '{{ printf "%.0f" (index $values "Er").Value }}'
      checks: '{{ printf "%.0f" (index $values "Fr").Value }}'
      spend_usd: '{{ printf "%.3f" (index $values "Gr").Value }}'
      applications: '{{ printf "%.0f" (index $values "Hr").Value }}'
      waiting_officer: '{{ printf "%.0f" (index $values "Ir").Value }}'
      waiting_operator: '{{ printf "%.0f" (index $values "Jr").Value }}'
    noDataState: OK
    execErrState: OK
    isPaused: false
