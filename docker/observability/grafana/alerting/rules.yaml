apiVersion: 1
deleteRules:
- orgId: 1
  uid: pf-digest
groups:
- orgId: 1
  name: permitflow
  folder: PermitFlow
  interval: 1m
  rules:
  - uid: pf-api-down
    title: PermitFlow API down
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: min by (environment) (up{job="permitflow-api"})
        instant: true
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
          operator:
            type: and
          query:
            params:
            - B
          reducer:
            type: last
            params: []
          type: query
    for: 2m
    labels:
      severity: critical
      kind: incident
    annotations:
      summary: The API's metrics endpoint has not answered for two minutes.
      value: '{{ printf "%.3g" $values.B.Value }}'
    noDataState: Alerting
    execErrState: Error
    isPaused: false
  - uid: pf-api-5xx
    title: PermitFlow API error burst
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: (sum by (environment) (rate(permitflow_http_requests_total{status=~"5.."}[5m])) or sum by (environment) (rate(permitflow_http_requests_total[5m])) * 0) / sum by (environment) (rate(permitflow_http_requests_total[5m]))
        instant: true
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.01
          operator:
            type: and
          query:
            params:
            - B
          reducer:
            type: last
            params: []
          type: query
    for: 5m
    labels:
      severity: critical
      kind: incident
    annotations:
      summary: More than 1 % of API answers are 5xx over five minutes.
      value: '{{ printf "%.3g" $values.B.Value }}'
    noDataState: OK
    execErrState: Error
    isPaused: false
  - uid: pf-api-slow
    title: PermitFlow API slow
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: histogram_quantile(0.995, sum by (environment, le) (rate(permitflow_http_request_seconds_bucket[10m])))
        instant: true
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.5
          operator:
            type: and
          query:
            params:
            - B
          reducer:
            type: last
            params: []
          type: query
    for: 10m
    labels:
      severity: warning
      kind: incident
    annotations:
      summary: The 99.5th percentile of API latency is above 500 ms.
      value: '{{ printf "%.3g" $values.B.Value }}'
    noDataState: OK
    execErrState: Error
    isPaused: false
  - uid: pf-checks-failing
    title: PermitFlow document checks failing
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: (sum by (environment) (rate(permitflow_verification_runs_total{outcome=~"failed|unavailable"}[30m])) or sum by (environment) (rate(permitflow_verification_runs_total[30m])) * 0) / sum by (environment) (rate(permitflow_verification_runs_total[30m]))
