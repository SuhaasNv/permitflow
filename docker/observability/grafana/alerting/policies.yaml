apiVersion: 1
policies:
- orgId: 1
  receiver: telegram
  group_by:
  - alertname
  - environment
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
  - receiver: telegram
    object_matchers:
    - - kind
      - '='
      - digest
    group_by:
    - kind
    group_wait: 10s
    group_interval: 1h
    repeat_interval: 1h
