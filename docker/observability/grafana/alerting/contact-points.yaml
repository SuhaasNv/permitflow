apiVersion: 1
contactPoints:
- orgId: 1
  name: telegram
  receivers:
  - uid: pf-telegram
    type: telegram
    disableResolveMessage: false
    settings:
      bottoken: "__TELEGRAM_BOT_TOKEN__"
      chatid: "__TELEGRAM_CHAT_ID__"
      message: '{{ template "permitflow.telegram" . }}'
      parse_mode: HTML
      disable_web_page_preview: true
