services:
  db:
    image: postgres:16-alpine
    container_name: permitflow-db
    environment:
      POSTGRES_USER: permitflow
      POSTGRES_PASSWORD: permitflow
      POSTGRES_DB: permitflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U permitflow -d permitflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: permitflow-backend
    profiles: ["full"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://permitflow:permitflow@db:5432/permitflow
      UPLOAD_DIR: /data/uploads
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  # Observability (US-077): `docker compose --profile observability up -d`. Prometheus scrapes the API's
  # /metrics (bearer token METRICS_TOKEN from .env; target host.docker.internal:8000 for a backend on the
  # host, backend:8000 with the full profile) and Grafana serves the provisioned dashboard on :3001.
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: permitflow-prometheus
    profiles: ["observability"]
    env_file: .env
    environment:
      METRICS_TARGET: ${METRICS_TARGET:-host.docker.internal:8000}
      METRICS_SCHEME: ${METRICS_SCHEME:-http}
      ENVIRONMENT_LABEL: ${ENVIRONMENT_LABEL:-local}
    entrypoint: ["/bin/sh", "/etc/prometheus/start.sh"]
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/observability/prometheus-start.sh:/etc/prometheus/start.sh:ro
      - ./docker/observability/prometheus.local.yml:/etc/prometheus/prometheus.tpl.yml:ro
      - ./docker/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus:/prometheus

  grafana:
    image: grafana/grafana-oss:12.1.0
    container_name: permitflow-grafana
    profiles: ["observability"]
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      GF_PATHS_PROVISIONING: /var/lib/grafana/pf/provisioning
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-permitflow}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
      # Telegram alerts (optional): both set -> the alerting files are provisioned at start
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    entrypoint: ["/bin/sh", "/etc/grafana/start.sh"]
    ports:
      - "3001:3000"
    volumes:
      - ./docker/observability/grafana-start.sh:/etc/grafana/start.sh:ro
      - ./docker/observability/grafana:/etc/grafana/provisioning-src:ro
      - grafana:/var/lib/grafana
    depends_on:
      - prometheus

  telegram-bot:
    image: python:3.12-alpine
    container_name: permitflow-telegram-bot
    profiles: ["observability"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      PROMETHEUS_URL: http://prometheus:9090
      DASHBOARD_URL: ${DASHBOARD_URL:-https://grafana.dev.permitflow.space/d/permitflow/permitflow}
    command: ["sh", "-c", "[ -n \"$$TELEGRAM_BOT_TOKEN\" ] || { echo 'telegram-bot: no token, idle'; sleep infinity; }; exec python -u /bot.py"]
    volumes:
      - ./docker/observability/telegram-bot/bot.py:/bot.py:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
  uploads:
  prometheus:
  grafana:
