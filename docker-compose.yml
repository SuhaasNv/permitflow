services:
  db:
    image: postgres:16-alpine
    container_name: permitflow-db
    environment:
      POSTGRES_USER: permitflow
      POSTGRES_PASSWORD: permitflow
      POSTGRES_DB: permitflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U permitflow -d permitflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: permitflow-backend
    profiles: ["full"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://permitflow:permitflow@db:5432/permitflow
      UPLOAD_DIR: /data/uploads
      # US-097: STORAGE_BACKEND=s3 (shell or .env) sends uploads to the MinIO below instead of the volume.
      # The default stays local. These are the local MinIO's development values, not real credentials.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: permitflow-uploads
      S3_ACCESS_KEY_ID: permitflow
      S3_SECRET_ACCESS_KEY: permitflow-local
      S3_ADDRESSING_STYLE: path
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  # Object storage for uploads (US-097): `docker compose --profile storage up -d`. S3 API on :9000, console
  # on :9001 (sign in permitflow / permitflow-local). Used only when STORAGE_BACKEND=s3; nothing else
  # depends on it. MinIO no longer publishes images of its own, so this is the Chainguard build of it, pinned by
  # digest (the `latest` build of 9 Oct 2026); bump it on purpose with `docker pull` and `docker inspect`.
  # The ports are bound to this machine only: the development credentials below must not face the network.
  minio:
    image: cgr.dev/chainguard/minio@sha256:59667194421209c2c1eacbe761e24787e047985c5dfa96b15da9b59fe9b55cd0
    container_name: permitflow-minio
    profiles: ["storage"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: permitflow
      MINIO_ROOT_PASSWORD: permitflow-local
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio:/data

  # One-shot: creates the bucket, then exits. The image has no shell, so the wait for MinIO is the
  # restart policy: it fails until MinIO answers, and stops once the bucket exists.
  minio-init:
    image: cgr.dev/chainguard/minio-client@sha256:7a5387f27d1aa8fc11286acde9e024b7b1b77585e17c36378552eeafcccf2ba3
    container_name: permitflow-minio-init
    profiles: ["storage"]
    environment:
      MC_HOST_local: http://permitflow:permitflow-local@minio:9000
    command: ["mb", "--ignore-existing", "local/permitflow-uploads"]
    restart: on-failure
    depends_on:
      - minio

  # Observability (US-077): `docker compose --profile observability up -d`. Prometheus scrapes the API's
  # /metrics (bearer token METRICS_TOKEN from .env; target host.docker.internal:8000 for a backend on the
  # host, backend:8000 with the full profile) and Grafana serves the provisioned dashboard on :3001.
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: permitflow-prometheus
    profiles: ["observability"]
    env_file: .env
    environment:
      METRICS_TARGET: ${METRICS_TARGET:-host.docker.internal:8000}
      METRICS_SCHEME: ${METRICS_SCHEME:-http}
      ENVIRONMENT_LABEL: ${ENVIRONMENT_LABEL:-local}
    entrypoint: ["/bin/sh", "/etc/prometheus/start.sh"]
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/observability/prometheus-start.sh:/etc/prometheus/start.sh:ro
      - ./docker/observability/prometheus.local.yml:/etc/prometheus/prometheus.tpl.yml:ro
      - ./docker/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus:/prometheus

  grafana:
    image: grafana/grafana-oss:12.1.0
    container_name: permitflow-grafana
    profiles: ["observability"]
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      GF_PATHS_PROVISIONING: /var/lib/grafana/pf/provisioning
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-permitflow}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
      # Telegram alerts (optional): both set -> the alerting files are provisioned at start
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    entrypoint: ["/bin/sh", "/etc/grafana/start.sh"]
    ports:
      - "3001:3000"
    volumes:
      - ./docker/observability/grafana-start.sh:/etc/grafana/start.sh:ro
      - ./docker/observability/grafana:/etc/grafana/provisioning-src:ro
      - grafana:/var/lib/grafana
    depends_on:
      - prometheus

  telegram-bot:
    image: python:3.12-alpine
    container_name: permitflow-telegram-bot
    profiles: ["observability"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      PROMETHEUS_URL: http://prometheus:9090
      DASHBOARD_URL: ${DASHBOARD_URL:-https://grafana.dev.permitflow.space/d/permitflow/permitflow}
    command: ["sh", "-c", "[ -n \"$$TELEGRAM_BOT_TOKEN\" ] || { echo 'telegram-bot: no token, idle'; sleep infinity; }; exec python -u /bot.py"]
    volumes:
      - ./docker/observability/telegram-bot/bot.py:/bot.py:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
  uploads:
  minio:
  prometheus:
  grafana:
